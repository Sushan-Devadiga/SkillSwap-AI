<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Signup - SkillSwap AI</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts (Outfit & Inter) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Outfit:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        darkMode: "class",
        theme: {
          extend: {

                    "surface-variant": "#d9e3f6",
                    "on-surface": "#121c2a",
                    "surface-container-high": "#dee9fc",
                    "secondary": "#006b5f",

                    "surface-tint": "#006c49",
                    "surface-stroke": "#E5E7EB",
                    "primary-fixed": "#6ffbbe",
                    "secondary-container": "#6df5e1",
                    "tertiary-container": "#00b2d0",
                    "outline": "#6c7a71",
                    "error": "#ba1a1a",
                    "surface-container-low": "#eff4ff",
                    "surface-bg": "#F9FAFB",
                    "on-primary-fixed": "#002113",
                    "on-tertiary-fixed-variant": "#004e5c",
                    "tertiary-fixed-dim": "#4cd7f6",
                    "on-background": "#121c2a",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#10b981",
                    "on-primary-fixed-variant": "#005236",
                    "tertiary-fixed": "#acedff",
                    "inverse-surface": "#27313f",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-container": "#003f4b",

                    "on-secondary-fixed-variant": "#005048",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#00422b",
                    "on-surface-variant": "#3c4a42",
                    "outline-variant": "#bbcabf",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-container": "#e6eeff",
                    "on-tertiary-fixed": "#001f26",
                    "on-secondary-container": "#006f64",
                    "inverse-primary": "#4edea3",
                    "surface-dim": "#d0dbed",
                    "primary": "#006c49",
                    "surface": "#f8f9ff",
                    "inverse-on-surface": "#eaf1ff",
                    "secondary-fixed": "#71f8e4",
                    "background": "#f8f9ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "8px",
                    "stack-sm": "12px",
                    "stack-md": "24px",

<body class="h-full bg-surface-bg text-on-surface antialiased flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Note: TopAppBar and BottomNavBar are suppressed as this is a linear/transactional screen (Signup). -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_10px_30px_rgba(31,41,55,0.08)] border border-surface-stroke overflow-hidden relative">
<!-- Subtle AI Gradient Top Border Indicator -->
<div class="h-[2px] w-full" style="background: linear-gradient(135deg, #10B981 0%, #14B8A6 50%, #06B6D4 100%);"></div>
<div class="p-8 flex flex-col gap-stack-lg">
<!-- Header Section -->
<div class="text-center flex flex-col gap-stack-sm items-center">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="hub">hub</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Join the Community</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create your SkillSwap AI account to start collaborating.</p>
</div>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<div class="flex flex-col gap-stack-sm">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="name">Full Name</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl" data-icon="person">person</span>
</div>
<input class="block w-full pl-10 sm:text-sm border-surface-stroke rounded-md focus:ring-primary focus:border-primary bg-surface-container-lowest text-on-surface py-2" id="name" name="name" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 sm:text-sm border-surface-stroke rounded-md focus:ring-primary focus:border-primary bg-surface-container-lowest text-on-surface py-2" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Password</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 sm:text-sm border-surface-stroke rounded-md focus:ring-primary focus:border-primary bg-surface-container-lowest text-on-surface py-2" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="confirm-password">Confirm Password</label>
<div class="relative rounded-md shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl" data-icon="lock_reset">lock_reset</span>
</div>
<input class="block w-full pl-10 sm:text-sm border-surface-stroke rounded-md focus:ring-primary focus:border-primary bg-surface-container-lowest text-on-surface py-2" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-white bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                    Create Account
                    <span class="material-symbols-outlined ml-2 text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Caption -->
<div class="text-center font-body-sm text-body-sm text-on-surface-variant">
<p>By signing up, you agree to our <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.</p>
<p class="mt-4">Already have an account? <a class="text-primary font-semibold hover:underline" href="#">Log in</a></p>
</div>
</div>
</main>
</body></html>
