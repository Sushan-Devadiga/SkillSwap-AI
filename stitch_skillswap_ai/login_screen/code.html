<body class="bg-surface-bg text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md antialiased">

<div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
<div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-container/10 rounded-full blur-3xl"></div>
<div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-secondary-container/10 rounded-full blur-3xl transform translate-x-[-20%] translate-y-[20%]"></div>

<!-- Main Container -->

<!-- Gradient Top Border -->

<div class="p-stack-md sm:p-stack-lg">
<!-- Header Section -->
<div class="flex flex-col items-center mb-stack-md text-center">
<div class="w-20 h-20 mb-stack-sm rounded-lg overflow-hidden border border-surface-stroke shadow-sm flex items-center justify-center bg-surface-bright">
<img alt="SkillSwap AI Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEU7EsXny6qNolFXmzsReMkfcn6nPuZ1BjHIJXKM-_AJp-m0rOSs0Rs1cZbKlME-HImhCRtXdAbBUimmL8u5YlV7pR545y68nO-7kUadd7R-oiO14vag8qmek-1qk4-w9eKR_z9ukjJuphRmk9y7NsYzmMTpqbQyN8c2qSpwpnCsnxQme-wkpRKhQI9GwM5-8cmZopGXq-H7WZ2kTYQsw2ZXGAtIsngySJlizerV7QbOylK9SYP_lKqA"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-base">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to continue your learning journey.</p>
</div>
<!-- Form Section -->
<form action="#" class="space-y-stack-sm" method="POST">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-base" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-surface-stroke rounded-DEFAULT text-on-surface bg-surface-bright focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex items-center justify-between mb-base">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2 border border-surface-stroke rounded-DEFAULT text-on-surface bg-surface-bright focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center mt-base">
<input class="h-4 w-4 text-primary focus:ring-primary border-surface-stroke rounded bg-surface-bright" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<!-- Submit Button -->
<div class="pt-base">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-DEFAULT shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98]" type="submit">
                        Login
                        <span class="material-symbols-outlined ml-2 text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="mt-stack-md mb-stack-sm relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-stroke"></div>
</div>
<div class="relative flex justify-center">
<span class="px-2 bg-surface-container-lowest font-label-sm text-label-sm text-outline">Or continue with</span>
</div>
</div>
<!-- Social Login (Placeholder for typical modern patterns) -->

<svg class="h-4 w-4 mr-2 text-[#000000]" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.89-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-1.736 6.05-5.835 6.05-1.61 0-2.305-.58-4.125-.58-1.8 0-2.52.56-4.103.56-4.13 0-5.836-6.04-5.836-6.04-.54-1.55-.83-3.32-.83-4.98 0-3.13 1.735-4.8 4.26-4.8 1.91 0 3.22.87 4.26.87.95 0 2.45-.9 4.67-.9 2.08 0 3.51.74 4.39 1.83-3.95 1.88-3.23 6.45.14 8.01z"></path></svg>

</div>
<!-- Footer / Sign Up Link -->
<p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-stack-sm">
