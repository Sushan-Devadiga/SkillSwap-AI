<!-- Script for Chip Interaction -->
<script>
        function toggleChip(button) {
            button.classList.toggle('chip-selected');
            
            // Re-apply base styles if not selected
            if(button.classList.contains('chip-selected')) {
                button.classList.remove('text-on-surface-variant', 'bg-surface-container-lowest', 'border-surface-stroke');
            } else {
                button.classList.add('text-on-surface-variant', 'bg-surface-container-lowest', 'border-surface-stroke');
            }
        }
    </script>
