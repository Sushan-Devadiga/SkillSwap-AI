<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .chip {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .chip:active {
            transform: scale(0.95);
        }
        .chip.selected {
            background-color: theme('colors.secondary-container');
            color: theme('colors.on-secondary-container');
            border-color: transparent;
        }
        
        .progress-bar-fill {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-surface-bg text-on-surface h-full flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation for Onboarding (Simplified, no global nav elements) -->
<header class="w-full flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 bg-surface-container-lowest sticky top-0 z-10">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary-container">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Step 2 of 3</span>
<!-- Placeholder for symmetry -->
<div class="w-10 h-10"></div>
</header>
<!-- Progress Indicator -->
<div class="w-full h-1 bg-surface-container-highest">
<div class="h-full bg-primary-container progress-bar-fill" style="width: 66%;"></div>
</div>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center px-margin-mobile md:px-margin-desktop py-stack-lg max-w-[1280px] mx-auto w-full">
<div class="w-full max-w-2xl flex flex-col gap-stack-md">
<!-- Header Section -->
<div class="text-center md:text-left flex flex-col gap-stack-sm mb-stack-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-xl md:text-headline-xl text-on-surface">
                    What do you want to learn?
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    We'll find matches based on these interests. Select as many as you like.
                </p>
</div>
<!-- Search Bar for Skills -->
<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">search</span>
<input class="w-full h-14 pl-12 pr-4 rounded-xl border border-surface-stroke bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-shadow shadow-sm" placeholder="Search for skills (e.g., Python, Yoga, Marketing)" type="text"/>
</div>
<!-- AI Suggestion Container -->
<div class="w-full rounded-xl p-[2px] bg-gradient-to-r from-[#10B981] via-[#14B8A6] to-[#06B6D4] shadow-sm mb-stack-sm">
<div class="bg-surface-container-lowest rounded-[10px] p-stack-sm flex flex-col gap-stack-sm">
<div class="flex items-center gap-2 text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-md text-label-md uppercase tracking-wider">AI Suggested for you</span>
</div>
<div class="flex flex-wrap gap-2">
<button class="chip selected flex items-center gap-2 px-4 py-2 rounded-full border border-surface-stroke font-body-md text-body-md bg-secondary-container text-on-secondary-container">
                            Machine Learning
                            <span class="material-symbols-outlined text-[18px]">add</span>
</button>
<button class="chip flex items-center gap-2 px-4 py-2 rounded-full border border-surface-stroke font-body-md text-body-md bg-surface-container-lowest text-on-surface hover:bg-surface-container-low">
                            Data Visualization
                            <span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
</div>
<!-- Category Groups -->
<div class="flex flex-col gap-stack-md">
<!-- Category 1 -->
<div class="flex flex-col gap-stack-sm">
<h3 class="font-headline-md text-headline-md text-on-surface">Technology &amp; Programming</h3>
<div class="flex flex-wrap gap-2">
<button class="chip flex items-center gap-2 px-4 py-2 rounded-full border border-surface-stroke font-body-md text-body-md bg-surface-container-lowest text-on-surface hover:bg-surface-container-low">
                            React.js
                        </button>
<button class="chip selected flex items-center gap-2 px-4 py-2 rounded-full border border-surface-stroke font-body-md text-body-md bg-secondary-container text-on-secondary-container">
                            Python
                        </button>
<button class="chip flex items-center gap-2 px-4 py-2 rounded-full border border-surface-stroke font-body-md text-body-md bg-surface-container-lowest text-on-surface hover:bg-surface-container-low">
                            UI/UX Design
                        </button>
<button class="chip flex items-center gap-2 px-4 py-2 rounded-full border border-surface-stroke font-body-md text-body-md bg-surface-container-lowest text-on-surface hover:bg-surface-container-low">
                            Cloud Computing
                        </button>
</div>
</div>
<!-- Category 2 -->
<div class="flex flex-col gap-stack-sm">
<h3 class="font-headline-md text-headline-md text-on-surface">Languages</h3>
<div class="flex flex-wrap gap-2">
<button class="chip flex items-center gap-2 px-4 py-2 rounded-full border border-surface-stroke font-body-md text-body-md bg-surface-container-lowest text-on-surface hover:bg-surface-container-low">
                            Spanish
                        </button>
<button class="chip flex items-center gap-2 px-4 py-2 rounded-full border border-surface-stroke font-body-md text-body-md bg-surface-container-lowest text-on-surface hover:bg-surface-container-low">
                            Mandarin
                        </button>
<button class="chip flex items-center gap-2 px-4 py-2 rounded-full border border-surface-stroke font-body-md text-body-md bg-surface-container-lowest text-on-surface hover:bg-surface-container-low">
                            French
                        </button>
</div>
</div>
</div>

</main>
<!-- Bottom Action Area (Sticky) -->
<div class="w-full bg-surface-container-lowest border-t border-surface-stroke p-margin-mobile md:px-margin-desktop flex justify-center sticky bottom-0 z-20 shadow-[0px_-4px_20px_rgba(31,41,55,0.04)]">
<div class="w-full max-w-2xl flex justify-between items-center">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors px-4 py-3">
                Skip for now
            </button>
<button class="bg-primary-container text-on-primary hover:bg-primary transition-colors font-label-md text-label-md px-8 py-3 rounded-full flex items-center gap-2 shadow-sm">
                Continue
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
<script>
        // Simple interaction for chips
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', function() {
                this.classList.toggle('selected');
                
                if (this.classList.contains('selected')) {
                    this.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'hover:bg-surface-container-low');
                    this.classList.add('bg-secondary-container', 'text-on-secondary-container');
                    
                    // Toggle icon if present
                    const icon = this.querySelector('.material-symbols-outlined');
                    if (icon && icon.textContent === 'add') {
                        icon.textContent = 'check';
                    }
                } else {
                    this.classList.add('bg-surface-container-lowest', 'text-on-surface', 'hover:bg-surface-container-low');
                    this.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                    
                    // Toggle icon if present
                    const icon = this.querySelector('.material-symbols-outlined');
                    if (icon && icon.textContent === 'check') {
                        icon.textContent = 'add';
                    }
                }
            });
        });
    </script>
