<style>
        .splash-gradient {
            background: linear-gradient(135deg, #10B981 0%, #00422b 100%);
        }
        
        .fade-in-up {
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .pulse-glow {
            animation: pulseGlow 3s infinite alternate ease-in-out;
        }
        
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.1); }
            100% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.3); }
        }

    <!-- Subtle Background Elements -->

        </div>
        
        <!-- Loading Indicator -->

            <div class="w-12 h-1 bg-surface-container-lowest/20 rounded-full overflow-hidden">

            </div>
            <span class="font-label-sm text-label-sm text-surface-container-lowest/60 uppercase tracking-widest">Loading ecosystem</span>
        </div>
    </main>
    
    <style>
        @keyframes progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
